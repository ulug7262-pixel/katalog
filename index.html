var ST={d:null,sec:null,y:null,m:null};
var MON_UZ=['Yanvar','Fevral','Mart','Aprel','May','Iyun','Iyul','Avgust','Sentabr','Oktabr','Noyabr','Dekabr'];
var MON_RU=['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
function stMon(m){ return (lang==='ru'?MON_RU:MON_UZ)[m-1] }
function stTop(title,back){
 sTop(title,back);
 $('lg').onclick=function(){ lang=lang==='uz'?'ru':'uz'; try{localStorage.setItem('lp_lang',lang)}catch(e){}; stDraw() };
}
var ST_ROW='display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 14px;background:var(--surface);border-radius:12px;box-shadow:var(--shadow);margin-bottom:8px';
function stRow(left,sub,right){ return '<div style="'+ST_ROW+'"><div style="min-width:0"><b style="overflow-wrap:anywhere">'+left+'</b>'+(sub?'<div class="sm" style="color:var(--muted)">'+sub+'</div>':'')+'</div><b style="white-space:nowrap">'+right+'</b></div>' }
function stFolder(attr,ic,title,sub){ return '<button class="folder stf" '+attr+' style="width:100%;margin-bottom:10px"><span class="ic">'+ic+'</span><div><b>'+title+'</b><span class="n">'+sub+'</span></div></button>' }
function renderStats(){
 ST.sec=null; ST.y=null; ST.m=null;
 stTop(lang==='ru'?'Статистика':'Statistika',function(){ state.view=null; render() });
 var sb=$('sb'); sb.innerHTML='<div class="load">…</div>';
 post({act:'st'},function(r){
  if(!r||!r.ok){ sb.innerHTML='<div class="empty">'+esc((r&&r.msg)||t('oNet'))+'</div>'; return }
  ST.d=r; stDraw();
 });
}
function stDraw(){
 if(!ST.d) return;
 if(!ST.sec) stHome();
 else if(ST.y===null) stYears();
 else if(ST.sec==='profit') stProfit();
 else if(ST.m===null) stPeriods();
 else stDetail();
}
function stHome(){
 var ru=lang==='ru';
 stTop(ru?'Статистика':'Statistika',function(){ state.view=null; render() });
 $('sb').innerHTML='<div class="mine" style="display:block">'
  +stFolder('data-s="cust"','🏆',ru?'Топ клиенты':'Top mijozlar',ru?'по компаниям · по месяцам и годам':'kompaniyalar bo‘yicha · oy va yil')
  +stFolder('data-s="profit"','💰',ru?'Прибыль':'Foyda',ru?'по месяцам и за год':'oyma-oy va yillik')
  +stFolder('data-s="prod"','📦',ru?'Топ товары':'Eng ko‘p sotilgan tovarlar',ru?'топ-10 за месяц и за год':'oy va yil bo‘yicha top-10')
  +'</div>';
 Array.prototype.forEach.call(document.querySelectorAll('[data-s]'),function(el){ el.onclick=function(){ ST.sec=el.dataset.s; ST.y=null; ST.m=null; stDraw() } });
}
function stSecName(){ var ru=lang==='ru'; return ST.sec==='cust'?(ru?'Топ клиенты':'Top mijozlar'):ST.sec==='profit'?(ru?'Прибыль':'Foyda'):(ru?'Топ товары':'Eng ko‘p sotilgan tovarlar') }
function stYears(){
 var ru=lang==='ru', d=ST.d, ys=Object.keys(d.years).sort().reverse(), h='';
 stTop(stSecName(),function(){ ST.sec=null; stDraw() });
 ys.forEach(function(y){
  var o=d.years[y].y, sub=ST.sec==='profit'?(ru?'Прибыль: ':'Foyda: ')+fmt(o.profit):o.orders+(ru?' заказов':' ta buyurtma');
  h+=stFolder('data-y="'+y+'"','📅',y,sub);
 });
 $('sb').innerHTML='<div class="mine" style="display:block">'+h+'</div>';
 Array.prototype.forEach.call(document.querySelectorAll('[data-y]'),function(el){ el.onclick=function(){ ST.y=Number(el.dataset.y); ST.m=null; stDraw() } });
}
function stMonths(y){ var ms=Object.keys(ST.d.years[y].m).map(Number); if(Number(y)===ST.d.cur[0]&&ms.indexOf(ST.d.cur[1])<0) ms.push(ST.d.cur[1]); return ms.sort(function(a,b){return b-a}) }
function stProfit(){
 var ru=lang==='ru', Y=ST.d.years[ST.y], o=Y.y, h='';
 stTop(stSecName()+' · '+ST.y,function(){ ST.y=null; stDraw() });
 h+='<div style="background:var(--accent);color:var(--accent-ink);border-radius:18px;padding:22px 18px;text-align:center;margin-bottom:12px"><small style="display:block;opacity:.85">'+(ru?'Прибыль за ':'Yillik foyda · ')+ST.y+'</small><div style="font:700 30px var(--f-head);margin-top:6px;overflow-wrap:anywhere">'+fmt(o.profit)+'</div></div>';
 h+='<div class="sm" style="text-align:center;color:var(--muted);margin:0 0 14px">'+(ru?'Оборот: ':'Aylanma: ')+fmt(o.turn)+' · '+(ru?'заказов: ':'buyurtmalar: ')+o.orders+'</div>';
 stMonths(ST.y).forEach(function(mo){
  var b=Y.m[mo]||{profit:0,orders:0,turn:0};
  h+=stRow(stMon(mo),b.orders+(ru?' заказов':' ta buyurtma'),fmt(b.profit));
 });
 $('sb').innerHTML=h;
}
function stPeriods(){
 var ru=lang==='ru', Y=ST.d.years[ST.y], h='';
 stTop(stSecName()+' · '+ST.y,function(){ ST.y=null; stDraw() });
 h+=stFolder('data-m="0"','📅',(ru?'Весь ':'Butun yil · ')+ST.y,Y.y.orders+(ru?' заказов':' ta buyurtma'));
 stMonths(ST.y).forEach(function(mo){ var b=Y.m[mo]; h+=stFolder('data-m="'+mo+'"','🗓',stMon(mo),(b?b.orders:0)+(ru?' заказов':' ta buyurtma')) });
 $('sb').innerHTML='<div class="mine" style="display:block">'+h+'</div>';
 Array.prototype.forEach.call(document.querySelectorAll('[data-m]'),function(el){ el.onclick=function(){ ST.m=Number(el.dataset.m); stDraw() } });
}
function stDetail(){
 var ru=lang==='ru', d=ST.d, Y=d.years[ST.y], yearly=ST.m===0, b=yearly?Y.y:(Y.m[ST.m]||{cust:[],prod:[],orders:0,goods:0,profit:0});
 var ttl=yearly?String(ST.y):stMon(ST.m)+' '+ST.y, h='', med=['🥇','🥈','🥉'];
 stTop(stSecName()+' · '+ttl,function(){ ST.m=null; stDraw() });

  if(!yearly&&b.cust.length>3) h+='<div class="sm" style="color:var(--muted);text-align:center;margin-top:8px">'+(ru?'4–10 места — компании свыше ':'4–10-o‘rinlar — oyiga ')+fmt(d.min)+(ru?' за месяц':' dan oshganlar')+'</div>';
 } else {
  var pl=b.prod;
  h+='<div class="sm" style="text-align:center;color:var(--muted);margin:0 0 12px">'+(ru?'Продано товара: ':'Sotilgan tovar: ')+b.goods+(ru?' шт.':' dona')+'</div>';
  if(!pl.length) h+='<div class="empty">'+(ru?'Пока нет данных':'Hozircha ma‘lumot yo‘q')+'</div>';
  pl.forEach(function(p,i){ h+=stRow((i<3?med[i]:(i+1)+'.')+' '+esc(p.n),p.o+(ru?' заказов · ':' ta buyurtma · ')+fmt(p.s),p.q+(ru?' шт.':' dona')) });
 }
 $('sb').innerHTML=h;
}

function ordFlow(x,engr0,back){
 var sh=$('sheet'), box=function(h,prev){ sh.innerHTML='<div class="shd">'+(prev?'<button class="back" id="pv" aria-label="'+t('back')+'">←</button>':'')+'<span class="grow"></span><button class="close" id="cl" aria-label="x">✕</button></div><div class="ord"><h3>'+esc(x.name)+'</h3>'+h+'</div>'; if(prev) $('pv').onclick=prev; $('cl').onclick=function(){ $('scrim').classList.remove('on'); sh.innerHTML='' }; sh.scrollTop=0 };

  var h='<div class="msg">'+esc(r.intro||t('oReg'))+'</div>';
  r.fields.forEach(function(f,i){ var ty=f.t===6?'tel':(f.t===5?'email':'text');
   h+='<h4>'+esc(f.title||f.text)+'</h4><input class="fi" id="rf'+i+'" type="'+ty+'" inputmode="'+(f.t===6?'tel':f.t===3?'decimal':'text')+'" placeholder="'+esc(f.t===6?'+998 90 123 45 67':(f.t===4?'dd.MM.yyyy':''))+'" autocomplete="off">' });
  h+='<div class="msg" id="er" style="display:none"></div><button class="cta" id="rs">'+t('oConf')+'</button><button class="sec" id="bk">'+t('oBack')+'</button>';
  box(h,back); $('bk').onclick=back;
  $('rs').onclick=function(){ var vals={}, ok=true; r.fields.forEach(function(f,i){ var v=$('rf'+i).value.trim(); if(!v) ok=false; vals[f.k]=v });
   var er=$('er'); if(!ok){ er.style.display='block'; er.textContent=r.bad||'?'; return }
   var b=$('rs'); b.disabled=true; b.textContent=t('oWait');
   api({act:'reg',d:(tg&&tg.initData)||'',id:x.id,f:JSON.stringify(vals)},function(z){ if(z.ok){ ordFlow(x,engr0,back) } else { b.disabled=false; b.textContent=t('oConf'); er.style.display='block'; er.textContent=z.msg||t('oNet') } }) } };
 var fail=function(r){
  if(r.code==='reg'&&r.fields&&r.fields.length){ regForm(r); return }
  var h='<div class="msg">'+esc(r.code==='reg'||r.code==='admin'||r.code==='auth'?t('oReg'):(r.msg||t('oNet')))+'</div>';
  if(r.code==='reg'||r.code==='admin'||r.code==='auth') h+='<button class="cta" id="ob">'+t('oBot')+'</button>';
  h+='<button class="sec" id="bk">'+t('oBack')+'</button>'; box(h,back);
  var ob=$('ob'); if(ob) ob.onclick=function(){ botLink(x.id) }; $('bk').onclick=back };
 box('<div class="msg">'+t('oWait')+'</div>');
 var init=(tg&&tg.initData)||''; if(!init){ fail({code:'auth'}); return }
 api({act:'chk',d:init,id:x.id},function(c){
  if(!c.ok){ fail(c); return }
  var qty=Math.max(c.min||1,1), g=engr0?'yes':'no', rules=c.rules||{};
  var priceOf=function(g){ return g==='yes'?(x.priceE||x.price):(x.price||x.priceE) };
  var gname=function(g){ return c.opt[g] };
  var nonce=String(Date.now())+Math.random().toString(36).slice(2,8);
  var who='';
  var whoId='';
  function step0(){ whoPick(box,{},function(w){ who=w.text; whoId=w.uid; step1() },back) }
  function step1(){
   box('<h4>'+t('oQty')+'</h4><div class="row"><div class="stp"><button id="mn">−</button><input id="qi" inputmode="decimal" value="'+qty+'"><button id="pl">+</button></div><span style="color:var(--muted)">'+t('inst')+': '+c.ostatok+(c.min>1?' · '+t('min')+': '+c.min:'')+'</span></div>'+
    '<h4>'+t('oEngr')+'</h4><div class="q">'+esc(c.q)+'</div>'+
    ['no','yes','book'].map(function(k){ return '<button class="opt" data-g="'+k+'" aria-pressed="'+(g===k)+'">'+esc(gname(k))+'</button>' }).join('')+
    '<div class="msg" id="er" style="display:none"></div>'+
    '<button class="cta" id="nx">'+t('oNext')+'</button><button class="sec" id="bk">'+t('oBack')+'</button>',c.staff?step0:back);
   var inp=$('qi'), er=$('er');
   var rd=function(){ return Number(String(inp.value).replace(',','.')) };
   $('mn').onclick=function(){ var v=rd()||0; v=Math.max(v-1,0); inp.value=v };
   $('pl').onclick=function(){ var v=rd()||0; inp.value=Math.min(v+1,c.ostatok) };
   Array.prototype.forEach.call(sh.querySelectorAll('.opt'),function(b){ b.onclick=function(){ qty=rd()||qty; g=b.dataset.g; step1() } });
   $('bk').onclick=back;
   $('nx').onclick=function(){
    var v=rd(), m=null;
    if(!(v>0)) m='?'; else if(rules.maxOrder&&rules.maxQty&&v>rules.maxQty) m='max '+rules.maxQty; else if(rules.whole&&Math.round(v)!==v) m=lang==='ru'?'Только целые числа':'Faqat butun son';
    else if(rules.minOrder&&c.min&&v<c.min) m=t('min')+': '+c.min; else if(v>c.ostatok) m=t('inst')+': '+c.ostatok;
    else if(rules.saleAll&&c.min&&!(c.ostatok-v>=c.min||c.ostatok-v===0)) m=t('inst')+': '+c.ostatok+' · '+t('min')+': '+c.min;
    if(m){ er.style.display='block'; er.textContent=m; return }
    qty=v; step2() };
  }
  function step2(){
   var tot=priceOf(g)*qty;
   box('<h4>'+t('oChk')+'</h4><div class="sum">'+(c.staff?'<div>👤 <b>'+esc(who)+'</b></div>':'')+'<div>'+t('oProd')+': <b>'+esc(x.name)+'</b></div><div>'+t('oQty')+': <b>'+qty+' '+t('pcs')+'</b></div><div>'+t('oEngr')+': <b>'+esc(gname(g))+'</b></div><div>'+t('oTot')+': <b>'+fmt(tot)+'</b></div></div>'+
    '<div class="msg" id="er" style="display:none"></div><button class="cta" id="ok">'+t('oConf')+'</button><button class="sec" id="ed">'+t('oEdit')+'</button>',step1);
   $('ed').onclick=step1;
   $('ok').onclick=function(){ var b=$('ok'); if(b.disabled) return; b.disabled=true; b.textContent=t('oWait');
    api({act:'ord',d:init,id:x.id,q:qty,g:g,n:nonce,w:who,wu:whoId},function(r){

      box('<div class="msg" style="font-weight:600">✅ '+esc(r.text)+'</div>'+(r.book?'<div class="msg">'+esc(t('oBookNote').replace('{u}',r.until))+'</div>':'')+'<button class="cta" id="fin">'+t('oBack')+'</button>');
      $('fin').onclick=function(){ $('scrim').classList.remove('on'); sh.innerHTML=''; load() }; return }
     if(r.code==='qty'||r.code==='net'||r.code==='err'){ b.disabled=false; b.textContent=t('oConf'); var er=$('er'); er.style.display='block'; er.textContent=r.msg||t('oNet'); return }
     fail(r) }) };
  }
  if(c.staff) step0(); else step1();
 });
