<html lang="uz"><head><meta charset="utf-8">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap">
<style>

:root{--f-head:'Space Grotesk','Inter',system-ui,sans-serif;--f-body:'Inter',system-ui,sans-serif;--book:#F4B93A;--bg:#0F151C;--surface:#18212B;--ink:#E8EDF2;--muted:#8E9BAB;--line:#273340;--accent:#3DF02F;--accent-ink:#06130A;--sale:#FF7154;--sale-soft:#3a1f19;--chip:#222D39;--good:#3DF02F;--accent-soft:#17301b;--staff:#5B86FF;--staff-soft:#1b2a52;--solid:#0B1016;--soldout:rgba(15,21,28,.7);--okbg:rgba(15,21,28,.96);--low-ink:#FF9C85;--page:#05080b;color-scheme:dark}
*{box-sizing:border-box}
.scr{flex:1;overflow-y:auto;padding:14px 16px 100px}
button{font:inherit;color:inherit;cursor:pointer}
.row{display:flex;align-items:center;gap:10px}
.logo{width:40px;height:40px;border-radius:12px;background:var(--solid);color:var(--accent);display:grid;place-items:center;font:700 16px var(--f-head)}
.ib{height:40px;min-width:40px;padding:0 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface);display:grid;place-items:center;font-weight:600;font-size:13px}
h1{margin:0;font:700 22px var(--f-head)}
.sm{font-size:12px;color:var(--muted)}
.search{display:flex;align-items:center;gap:10px;height:48px;padding:0 14px;background:var(--surface);border:1px solid var(--line);border-radius:14px;margin-top:12px}
.search input{border:0;outline:0;flex:1;font:15px var(--f-body);background:transparent;color:var(--ink);min-width:0}
.active{margin-top:12px;padding:12px 14px;border-radius:16px;background:var(--solid);color:#fff;display:flex;align-items:center;gap:12px;border:0;width:100%;text-align:left}
.active .ic{width:40px;height:40px;border-radius:12px;background:#2A3644;display:grid;place-items:center;flex-shrink:0}
.chips{display:flex;gap:8px;overflow-x:auto;padding:14px 0 4px;scrollbar-width:none}
.chips button{flex-shrink:0;height:38px;padding:0 14px;border-radius:19px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:14px;display:flex;gap:6px;align-items:center}
.chips button span{font-weight:500;font-size:12px;color:var(--muted)}
.chips button.on{background:var(--solid);color:#fff;border-color:var(--solid)}
.chips button.on span{color:var(--accent)}
.sec{display:flex;justify-content:space-between;align-items:baseline;margin:12px 0 8px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card{background:var(--surface);border-radius:16px;border:1px solid var(--line);overflow:hidden;text-align:left;padding:0;display:flex;flex-direction:column}
.ph{height:120px;background:var(--chip);display:grid;place-items:center;position:relative;width:100%}
.bd{position:absolute;left:8px;top:8px;padding:3px 8px;border-radius:8px;font:600 11px var(--f-body)}
.bd.ok{background:var(--accent-soft);color:var(--good)}.bd.low{background:var(--sale-soft);color:var(--low-ink)}.bd.out{background:var(--chip);color:var(--muted);border:1px solid var(--line)}
.card .in{padding:10px 12px 12px;display:flex;flex-direction:column;gap:2px}
.card b{font:700 16px var(--f-head)}
.card.dis{opacity:.55}
.nav{position:absolute;left:0;right:0;bottom:0;height:74px;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(3,1fr);padding:8px 4px 14px}
.nav button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;color:var(--muted);position:relative;padding:0 2px;text-align:center;line-height:1.15}
.cat{display:flex;align-items:center;gap:14px;padding:14px;border-radius:16px;background:var(--surface);border:1px solid var(--line);width:100%;text-align:left;margin-top:10px}
.cat .ph{width:64px;height:64px;border-radius:14px;flex-shrink:0}
.prof{display:flex;align-items:center;gap:12px;padding:14px;border-radius:16px;background:var(--surface);border:1px solid var(--line);margin-top:12px}
.av{width:48px;height:48px;border-radius:24px;background:var(--solid);color:var(--accent);display:grid;place-items:center;font:700 18px var(--f-head);flex-shrink:0}
.nav button.on{color:var(--ink);font-weight:700}
.nav .cnt{position:absolute;top:-3px;left:58%;min-width:18px;height:18px;border-radius:9px;background:var(--solid);color:var(--accent);font:700 11px var(--f-body);display:grid;place-items:center;padding:0 4px}
.back{width:44px;height:44px;border-radius:22px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;flex-shrink:0}
.hero{height:280px;margin:-14px -16px 0;background:var(--chip);display:grid;place-items:center;position:relative}

.tags{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 14px}
.tags span{padding:6px 10px;border-radius:9px;background:var(--surface);border:1px solid var(--line);font-size:13px}
.opt{display:flex;align-items:center;gap:12px;padding:14px;border-radius:16px;background:var(--surface);border:1px solid var(--line);width:100%;text-align:left;margin-bottom:8px}
.opt.on{border:2px solid var(--ink);padding:13px}
.opt .rd{width:20px;height:20px;border-radius:50%;border:2px solid var(--muted);flex-shrink:0;display:grid;place-items:center}
.opt.on .rd{border-color:var(--ink)}.opt.on .rd::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--solid)}
.opt b.p{font:700 17px var(--f-head);margin-left:auto}
.foot{position:absolute;left:0;right:0;bottom:0;padding:12px 16px 18px;background:var(--surface);border-top:1px solid var(--line);display:flex;gap:10px}
.cta{flex:1;height:54px;border:0;border-radius:15px;background:var(--accent);color:var(--accent-ink);font:700 17px var(--f-head)}

.box{padding:16px;background:var(--surface);border-radius:16px;border:1px solid var(--line);margin-top:12px}
.qty{width:100%;height:60px;border-radius:14px;border:2px solid var(--ink);padding:0 16px;font:700 28px var(--f-head);color:var(--ink);background:var(--surface);margin:8px 0 6px;outline:0}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;background:var(--chip);border-radius:14px}
.seg button{height:42px;border:0;border-radius:11px;background:transparent;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--ink);font-weight:700;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.total{margin-top:12px;padding:16px;border-radius:16px;background:var(--solid);color:#fff}
.total b{font:700 26px var(--f-head);color:var(--accent)}
.debt{padding:16px;border-radius:16px;background:var(--sale);color:#fff;display:flex;justify-content:space-between;align-items:center;margin-top:10px}
.debt b{font:700 22px var(--f-head)}
.oc{background:var(--surface);border-radius:16px;border:1px solid var(--line);padding:14px;margin-top:10px;display:flex;flex-direction:column;gap:10px}
.oc.dim{opacity:.6}
.tp{display:flex;justify-content:space-between;gap:8px}
.ch{flex-shrink:0;align-self:flex-start;padding:4px 10px;border-radius:99px;font:600 12px var(--f-body)}
.ch.new{background:var(--chip)}.ch.debt{background:var(--sale);color:#fff}.ch.book{background:var(--book);color:#2B1D00}.ch.done{background:var(--accent);color:var(--accent-ink)}.ch.cx{background:var(--chip);color:var(--muted)}.ch.yes{background:var(--staff-soft);color:var(--staff)}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.steps div{display:flex;flex-direction:column;gap:5px;font-size:11px;color:var(--muted)}
.steps i{height:6px;border-radius:3px;background:var(--line)}
.steps div.on{color:var(--ink);font-weight:600}.steps div.on i{background:var(--accent)}
.bk{display:flex;gap:8px}
.bk span{flex:1;font-size:13px;color:#2B1D00;background:#FFF1CC;border-radius:10px;padding:10px 12px}
.bk button,.xbtn{border:1px solid #F2B8AA;background:var(--surface);color:var(--sale);border-radius:10px;padding:0 12px;font-weight:600;font-size:13px;min-height:44px}
.wp{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted)}
.wp i{width:52px;height:52px;border-radius:10px;background:var(--chip)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.stats button{text-align:left;padding:10px 12px;border-radius:14px;border:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column}
.stats button.on{border:2px solid var(--ink);padding:9px 11px}
.stats b{font:700 22px var(--f-head)}
.cl{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:10px;background:var(--bg);font-size:13px}
.cl em{margin-left:auto;font-style:normal;font-weight:600;font-size:12px;color:var(--good)}
.acts{display:flex;gap:8px}
.acts .go{flex:1;height:48px;border:0;border-radius:13px;background:var(--accent);color:var(--accent-ink);font:700 15px var(--f-head)}
.acts .sq{width:48px;height:48px;border-radius:13px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center}
.acts .sq.r{border-color:#F2B8AA}
.sheet{position:absolute;inset:0;background:rgba(10,15,20,.45);display:flex;align-items:flex-end;z-index:5}
.sheet>div{background:var(--surface);width:100%;border-radius:22px 22px 0 0;padding:18px 16px 24px}
.sheet h3{margin:0 0 4px;font:700 19px var(--f-head)}
.pick{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.pick button{height:52px;border-radius:13px;border:1px solid var(--line);background:var(--bg);font-weight:600}
.drop{height:120px;border:2px dashed var(--line);border-radius:14px;display:grid;place-items:center;color:var(--muted);margin-top:12px;width:100%;background:var(--bg)}
.toast{position:absolute;left:16px;right:16px;top:14px;background:var(--solid);color:#fff;padding:12px 14px;border-radius:14px;font-size:14px;z-index:9;display:flex;gap:8px;align-items:center}
.empty{text-align:center;color:var(--muted);padding:40px 10px}
.hero2{margin:0 -16px;padding:16px 16px 18px;background:var(--solid);color:#fff;border-radius:0 0 24px 24px}
.stcard{margin-top:14px;width:100%;display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:16px;background:var(--surface);border:1px solid var(--line);text-align:left}
.stcard b{display:block;font:600 15px var(--f-head);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stl{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);margin-top:2px}
.stl em{font-style:normal}
.sdot{width:8px;height:8px;border-radius:4px;background:var(--accent);box-shadow:0 0 0 3px rgba(61,240,47,.18)}
.sdot.bk{background:var(--book);box-shadow:0 0 0 3px rgba(244,185,58,.18)}
.stdebt{display:block;margin-top:4px;font:700 13px var(--f-body);color:var(--sale)}
.chev{font-size:22px;color:var(--muted)}
.stcard.debt{border-color:rgba(255,113,84,.45)}
.stcard.debt .fic{background:var(--sale-soft);color:var(--sale)}
.stbig{display:block;font:700 20px var(--f-head);color:var(--sale);margin-top:1px}
.htop{position:relative;z-index:4;margin:0 -16px;padding:14px 16px 12px;background:var(--solid);color:#fff}
.htop .logo{background:#2A3644}
.htop .row{gap:6px}
.htop .ib{min-width:38px;height:38px;padding:0 9px}
.htop .ib.igb{color:#F2557A;text-decoration:none}
.hn{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hero2{padding-top:2px!important}
.htop .ib.call{color:var(--accent)}
.htop .ib.tgb{color:#2AABEE;text-decoration:none}

.tel{display:flex;align-items:center;gap:12px;padding:14px;border-radius:14px;background:var(--bg);margin-top:10px;text-decoration:none;color:var(--ink)}
.tel .ti{width:42px;height:42px;border-radius:21px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;flex-shrink:0}
.tel b{font:700 17px var(--f-head)}
.tel .go2{font-weight:600;font-size:13px;color:var(--good)}
.cancel{width:100%;height:50px;margin-top:12px;border-radius:13px;border:1px solid var(--line);background:transparent;font-weight:600}
.hl{font-size:13px;color:#AEB8C4}.hn{font:700 20px var(--f-head)}
.ib.dk{background:#2A3644;border-color:#2A3644;color:#fff}
.search.dk{background:#222C38;border-color:#2F3B49;margin-top:14px}.search.dk input{color:#fff}.search.dk input::placeholder{color:#8E9BAB}
.salebn{margin-top:14px;width:100%;display:flex;align-items:center;gap:12px;padding:16px;border-radius:18px;border:1px solid rgba(60,220,70,.35);background:linear-gradient(100deg,#0d2a14 0%,#14451c 48%,#1f7a2a 100%);color:#fff;text-align:left;position:relative;overflow:hidden;min-height:72px}
.salebn b{font:700 20px var(--f-head)}.salebn span span{font-size:13px;color:#cdeccf}
.salebn .sic{color:#4cf04a}.salebn .pc{font:700 54px var(--f-head);color:#4cf04a;opacity:.9;line-height:1}
.folders{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.folder{display:flex;flex-direction:column;gap:10px;padding:14px;border-radius:16px;background:var(--surface);border:0;box-shadow:0 1px 2px rgba(23,32,43,.06),0 6px 18px rgba(23,32,43,.07);text-align:left}
.folder.wide{grid-column:1/-1;flex-direction:row;align-items:center}
.folder b{font:600 15px var(--f-head);display:block}.folder .n{display:block;font-size:12px;color:var(--muted);margin-top:2px}
.fic{width:42px;height:42px;border-radius:12px;background:var(--chip);display:grid;place-items:center;color:var(--ink);flex-shrink:0}
.fic.dark{background:var(--solid);color:var(--accent)}.fic.red{background:var(--sale-soft);color:var(--sale)}.fic.blue{background:var(--staff-soft);color:var(--staff)}.fic.green{background:#14451c;color:#4cf04a}
.lbl{font:700 15px var(--f-head);margin:18px 2px 0}
.contact{margin-top:12px;width:100%;display:flex;align-items:center;gap:12px;padding:14px;border-radius:16px;background:var(--surface);border:0;box-shadow:0 1px 2px rgba(23,32,43,.06),0 6px 18px rgba(23,32,43,.07)}
.contact .ci{width:42px;height:42px;border-radius:12px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center}
.contact b{display:block;font:600 15px var(--f-head)}
.card{border:0;box-shadow:0 1px 2px rgba(23,32,43,.06),0 6px 18px rgba(23,32,43,.07)}
.card .ph{height:140px}
.card .nm{font-weight:600;font-size:14px}
.prc{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px}.prc b{font:700 16px var(--f-head)}
s.old{color:var(--muted);font-size:12px;font-weight:500}b.sl{color:var(--sale)}
.stk{font-size:12px;color:var(--muted);margin-top:2px}.stk.low{color:var(--sale);font-weight:600}
.bd.sale{background:var(--sale);color:#fff;font-weight:700}.bd.nw{background:var(--accent);color:var(--accent-ink);font-weight:700}.bd.two{top:34px}
.soldout{position:absolute;inset:0;background:var(--soldout);display:grid;place-items:center;font:700 14px var(--f-head);color:var(--muted)}
.mc{position:absolute;right:8px;bottom:8px;background:rgba(23,32,43,.75);color:#fff;font:600 11px var(--f-body);padding:3px 7px;border-radius:8px}
.dots{position:absolute;bottom:14px;left:0;right:0;display:flex;justify-content:center;gap:6px}.dots i{width:6px;height:6px;border-radius:3px;background:#B8C2CD}.dots i:first-child{width:18px;background:var(--ink)}
.vbtn{position:absolute;right:14px;top:14px;height:40px;padding:0 14px;border-radius:20px;background:var(--solid);color:#fff;display:flex;align-items:center;font-weight:600;font-size:13px}
.nav.n3{grid-template-columns:repeat(2,1fr)}
.lp3{background:#000!important;perspective:160px;overflow:hidden}
.lp3 .spin{position:relative;width:40px;height:40px;transform-style:preserve-3d;animation:spn 5s linear infinite}
.lp3 .spin img{position:absolute;inset:0;width:40px;height:40px;display:block}
.lp3 .spin img:first-child{filter:drop-shadow(0 0 3px rgba(75,240,40,.55))!important}
@keyframes spn{from{transform:rotateY(0)}to{transform:rotateY(360deg)}}
.logo3d{width:40px;height:40px;perspective:300px;flex-shrink:0}
.flip{position:relative;width:100%;height:100%;transform-style:preserve-3d;animation:flp 7s cubic-bezier(.6,0,.3,1) infinite}
.face{position:absolute;inset:0;border-radius:12px;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden;display:grid;place-items:center}
.face.fr{background:#0F1720}
.face.bk{background:#2BD91F;color:#06130A;font:700 17px var(--f-head);transform:rotateY(180deg);box-shadow:inset 0 0 0 1px rgba(255,255,255,.25)}
@keyframes flp{0%,40%{transform:rotateY(0)}50%,90%{transform:rotateY(180deg)}100%{transform:rotateY(360deg)}}
.lzr{animation:lzr 3.6s ease-in-out infinite}
.lzb{animation:lzb 3.6s ease-in-out infinite;filter:drop-shadow(0 0 4px #2BD91F)}
@keyframes lzr{0%{width:0}55%{width:40px}100%{width:40px}}
@keyframes lzb{0%{transform:translateX(4px);opacity:1}55%{transform:translateX(36px);opacity:1}62%{opacity:0}100%{transform:translateX(36px);opacity:0}}
.salebn .pc{display:inline-block;animation:pcb 2.4s ease-in-out infinite;transform-origin:50% 60%}
@keyframes pcb{0%,70%,100%{transform:scale(1) rotate(0)}78%{transform:scale(1.18) rotate(-8deg)}86%{transform:scale(.96) rotate(4deg)}}
.salebn .shine{position:absolute;top:0;bottom:0;width:60px;left:-80px;background:linear-gradient(100deg,transparent,rgba(255,255,255,.22),transparent);transform:skewX(-18deg);animation:shn 3.2s ease-in-out infinite;pointer-events:none}
@keyframes shn{0%,55%{left:-80px}100%{left:110%}}
.bd.nw{animation:nwg 2s ease-in-out infinite}

.okv{position:absolute;inset:0;z-index:20;background:var(--okbg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;animation:okf .25s ease-out;text-align:center;padding:20px}

.okv span{font-size:14px;color:var(--muted);opacity:0;animation:okt .4s .85s ease-out forwards}

@keyframes okd{to{stroke-dashoffset:0}}

@keyframes okt{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.lp3 .spin,.flip,.lzr,.lzb,.salebn .pc,.salebn .shine,.bd.nw{animation:none}.lzr{width:40px}.lzb{opacity:0}.okc,.okp{animation-duration:.01s}}
.ord2{flex:1;display:flex;flex-direction:column;gap:10px;padding:14px 16px 12px;overflow:hidden}
.qrow{display:flex;justify-content:center;margin-top:6px}
.qbox{display:flex;align-items:baseline;gap:8px;min-width:200px;justify-content:center;padding:10px 18px;border-radius:18px;border:2px solid var(--accent);background:var(--surface)}

.qv{font:700 44px var(--f-head);line-height:1.1;display:flex;align-items:center}
.qph{color:var(--muted);opacity:.5}

.qu{font-size:15px;color:var(--muted)}
.qmsg{text-align:center;font-size:13px;color:var(--muted)}.qmsg.bad{color:var(--sale);font-weight:600}

.cta3{flex:none;height:52px;width:100%}

function vis(){ var P=DATA.products; return isStaff()?P:P.filter(function(x){return x.qty>0}) }
function catName(f){ return lang==='ru'?({Statuetkalar:'Статуэтки',Plaketkalar:'Плакетки',Medallar:'Медали'}[f]||f):f }
function folderList(){
 var P=vis(), out=[];
 var sale=P.filter(function(x){return x.old||x.oldE}), nw=P.filter(function(x){return x.isNew});
 if(sale.length) out.push({id:'@sale',name:L('Chegirmalar','Скидки'),sale:true,n:sale.length});
 if(nw.length) out.push({id:'@new',name:L('Yangi kelganlar','Новинки'),ic:'star',n:nw.length});
 var names=(DATA.cats||[]).slice();
 P.forEach(function(x){(x.folders||[]).forEach(function(f){ if(names.indexOf(f)<0) names.push(f) })});
 names.forEach(function(f){ var n=P.filter(function(x){return (x.folders||[]).indexOf(f)>=0}).length; if(n) out.push({id:f,name:catName(f),ic:/plaket|плакет/i.test(f)?'plaque':/statu|статуэт/i.test(f)?'trophy':/medal|медал/i.test(f)?'medal':'folder',n:n}) });
 return out;
}
function inFolder(x,id){ if(id==='@all') return true; if(id==='@sale') return !!(x.old||x.oldE); if(id==='@new') return !!x.isNew; return (x.folders||[]).indexOf(id)>=0 }
function discPct(x){ var a=x.old?1-x.price/x.old:0, b=x.oldE?1-x.priceE/x.oldE:0; return Math.round(Math.max(a,b)*100) }
